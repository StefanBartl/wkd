name: Record demos

# Re-records every demos/*.tape with VHS in a clean Neovim (demos/init.lua)
# and publishes the videos as the single-commit orphan branch `demo-assets`;
# the deploy workflow copies that branch into public/demos/. Recordings are
# therefore reproducible, never stale, and never in main's history.
#
# One job per tape (a matrix read from demos/demos.json), so a run takes
# about as long as the slowest tape rather than the sum of all of them; the
# publish job collects the artifacts and pushes the branch once.
#
# VHS runs in its own container image: Chromium, ttyd, ffmpeg and the fonts
# there are the combination VHS is released against. Neovim stable and the
# plugin checkouts are mounted in.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'demos/**'
      - '.github/workflows/demos.yml'

permissions:
  contents: read

concurrency:
  group: demos
  cancel-in-progress: false

env:
  # v0.12.0 (2026-09-09) exits 0 without writing any output on Linux runners,
  # charmbracelet/vhs#787; stay on v0.11.0 until that is fixed.
  VHS_IMAGE: ghcr.io/charmbracelet/vhs:v0.11.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tapes: ${{ steps.list.outputs.tapes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: list
        name: One matrix entry per tape
        run: |
          # Every tape file must be in the manifest (and the other way round):
          # a tape without an entry would silently never be recorded.
          for tape in demos/*.tape; do
            case "$tape" in demos/_*) continue ;; esac
            name=$(basename "$tape" .tape)
            jq -e --arg s "$name" '.tapes[] | select((.tape // .plugin) == $s)' demos/demos.json >/dev/null \
              || { echo "::error::$tape has no entry in demos/demos.json"; exit 1; }
          done
          for name in $(jq -r '.tapes[] | (.tape // .plugin)' demos/demos.json); do
            [ -f "demos/$name.tape" ] || { echo "::error::demos/demos.json lists $name but demos/$name.tape is missing"; exit 1; }
          done
          tapes=$(jq -c '[.tapes[] | { tape: (.tape // .plugin), plugin: .plugin, deps: (.deps | join(" ")) }]' demos/demos.json)
          echo "tapes=$tapes" >> "$GITHUB_OUTPUT"
          echo "$tapes" | jq -r '.[] | "\(.tape): \(.deps)"'

  record:
    needs: plan
    runs-on: ubuntu-latest
    name: ${{ matrix.tape.tape }}
    strategy:
      fail-fast: false
      matrix:
        tape: ${{ fromJSON(needs.plan.outputs.tapes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Neovim stable
        run: |
          mkdir -p "$RUNNER_TEMP/nvim"
          curl -sSL -o "$RUNNER_TEMP/nvim.tar.gz" \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP/nvim" --strip-components=1
          "$RUNNER_TEMP/nvim/bin/nvim" --version | head -1

      # Tools the plugins shell out to (ripgrep for replacer.nvim and
      # insights.nvim, fd for pickers.nvim, curl for hover.nvim), mounted into the container.
      - name: External tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools/bin"
          # Pinned by version and checksum: these binaries run inside the container
          # that produces what the site serves.
          fetch() { # url sha256 binary
            curl -sSL -o "$RUNNER_TEMP/tools/archive" "$1"
            echo "$2  $RUNNER_TEMP/tools/archive" | sha256sum -c - >/dev/null
            rm -rf "$RUNNER_TEMP/tools/unpack"; mkdir -p "$RUNNER_TEMP/tools/unpack"
            tar -xf "$RUNNER_TEMP/tools/archive" -C "$RUNNER_TEMP/tools/unpack"
            mv "$(find "$RUNNER_TEMP/tools/unpack" -type f -name "$3" | head -1)" "$RUNNER_TEMP/tools/bin/$3"
          }
          fetch "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz" \
            33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c rg
          fetch "https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz" \
            761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7 fd
          # curl: hover.nvim's URL previews fetch the page (the site itself, in the tape).
          fetch "https://github.com/stunnel/static-curl/releases/download/8.22.0/curl-linux-x86_64-musl-8.22.0.tar.xz" \
            dfb02460ba2abe513087538f12a3cf79b74b64a5ea3787ce8ac0cdb11251f884 curl
          "$RUNNER_TEMP/tools/bin/rg" --version | head -1
          "$RUNNER_TEMP/tools/bin/fd" --version
          "$RUNNER_TEMP/tools/bin/curl" --version | head -1

      - name: Clone the checkouts this tape needs
        env:
          PLUGIN: ${{ matrix.tape.plugin }}
          DEPS: ${{ matrix.tape.deps }}
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          owner=$(jq -r .owner src/data/registry.json)
          always=$(jq -r '(.always // []) | join(" ")' demos/demos.json)
          # A bare slug is one of the family (<owner>/<slug>.nvim). A third-party
          # dependency is pinned to a commit (owner/repo@sha): its code runs in
          # the container that writes what the site serves.
          for dep in $always $PLUGIN $DEPS; do
            case "$dep" in
              */*@*)
                repo="${dep%@*}"; sha="${dep##*@}"; dir="$RUNNER_TEMP/repos/${repo##*/}"
                git init --quiet "$dir"
                git -C "$dir" fetch --quiet --depth 1 "https://github.com/$repo.git" "$sha"
                git -C "$dir" -c advice.detachedHead=false checkout --quiet FETCH_HEAD ;;
              */*) echo "::error::third-party dependency '$dep' must be pinned as owner/repo@sha"; exit 1 ;;
              *)   git clone --quiet --depth 1 "https://github.com/$owner/$dep.nvim.git" "$RUNNER_TEMP/repos/$dep.nvim" ;;
            esac
          done
          ls "$RUNNER_TEMP/repos"

      - name: Record
        env:
          TAPE: ${{ matrix.tape.tape }}
        run: |
          docker pull -q "$VHS_IMAGE"
          mkdir -p demos/out
          # The container sees the repo at /vhs (its WORKDIR), Neovim at
          # /opt/nvim and the checkouts at /opt/repos; the tapes cd to $WKD_ROOT.
          docker run --rm \
            -v "$PWD:/vhs" \
            -v "$RUNNER_TEMP/nvim:/opt/nvim:ro" \
            -v "$RUNNER_TEMP/repos:/opt/repos:ro" \
            -v "$RUNNER_TEMP/tools:/opt/tools:ro" \
            -e PATH="/opt/nvim/bin:/opt/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e PLUGINS_DIR=/opt/repos -e WKD_ROOT=/vhs -e TERM=xterm-256color \
            "$VHS_IMAGE" "demos/$TAPE.tape"
          # The container runs as root: take the outputs back (VHS writes them
          # relative to its working directory, i.e. ./out).
          sudo chown -R "$(id -u):$(id -g)" demos out 2>/dev/null || true
          # (never the fixtures: demos/fixtures/intro.mp4 is a hover target, not a recording)
          find ./out ./demos -type f \( -name "*.webm" -o -name "*.mp4" \) -not -path "./demos/out/*" -not -path "./demos/fixtures/*" -print -exec mv -t demos/out/ {} + 2>/dev/null || true
          # Diagnostics written by :DemoDump (demos/init.lua): into the log, not the branch.
          for dump in demos/out/_dump-*.txt; do
            [ -f "$dump" ] || continue
            echo "::group::$dump"; cat "$dump"; echo "::endgroup::"
            rm -f "$dump"
          done
          test -f "demos/out/$TAPE.webm" || { echo "::error::demos/$TAPE.tape produced no recording"; exit 1; }
          # Poster: one frame, with the container's ffmpeg.
          docker run --rm -v "$PWD:/vhs" --entrypoint ffmpeg "$VHS_IMAGE" \
            -y -loglevel error -ss 1.5 -i "/vhs/demos/out/$TAPE.webm" -frames:v 1 "/vhs/demos/out/$TAPE.png"
          sudo chown -R "$(id -u):$(id -g)" demos
          ls -l demos/out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-${{ matrix.tape.tape }}
          path: |
            demos/out/${{ matrix.tape.tape }}.webm
            demos/out/${{ matrix.tape.tape }}.mp4
            demos/out/${{ matrix.tape.tape }}.png
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-pushes the demo-assets branch
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: demo-*
          path: out
          merge-multiple: true

      - name: Publish demo-assets branch
        run: |
          cd out
          # Only recordings and posters leave this workflow: the deploy copies
          # the branch verbatim under the site's origin, so nothing else may
          # ride along from a container that ran third-party code.
          stray=$(find . -type f -not \( -name "*.webm" -o -name "*.mp4" -o -name "*.png" \) | head -5)
          if [ -n "$stray" ]; then echo "::error::unexpected files: $stray"; exit 1; fi
          ls -l
          git init -q
          git checkout -q -b demo-assets
          git add .
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -q -m "demos recorded $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::12}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
