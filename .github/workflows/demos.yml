name: Record demos

# Re-records every demos/*.tape with VHS in a clean Neovim (demos/init.lua)
# and publishes the videos as the single-commit orphan branch `demo-assets`;
# the deploy workflow copies that branch into public/demos/. Recordings are
# therefore reproducible, never stale, and never in main's history.
#
# VHS runs in its own container image: Chromium, ttyd, ffmpeg and the fonts
# there are the combination VHS is released against. Neovim stable and the
# plugin checkouts are mounted in.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'demos/**'
      - '.github/workflows/demos.yml'

permissions:
  contents: write # force-pushes the demo-assets branch

concurrency:
  group: demos
  cancel-in-progress: false

env:
  # v0.12.0 (2026-09-09) exits 0 without writing any output on Linux runners,
  # charmbracelet/vhs#787; stay on v0.11.0 until that is fixed.
  VHS_IMAGE: ghcr.io/charmbracelet/vhs:v0.11.0

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Neovim stable
        run: |
          mkdir -p "$RUNNER_TEMP/nvim"
          curl -sSL -o "$RUNNER_TEMP/nvim.tar.gz" \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP/nvim" --strip-components=1
          "$RUNNER_TEMP/nvim/bin/nvim" --version | head -1

      # Tools the plugins shell out to (ripgrep for replacer.nvim and insights.nvim, fd for pickers.nvim), mounted
      # into the container; without them a plugin shows its dependency panel.
      - name: External tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools/bin"
          # Pinned by version and checksum: these binaries run inside the container
          # that produces what the site serves.
          fetch() { # url sha256 binary
            curl -sSL -o "$RUNNER_TEMP/tools/archive.tgz" "$1"
            echo "$2  $RUNNER_TEMP/tools/archive.tgz" | sha256sum -c - >/dev/null
            tar -xzf "$RUNNER_TEMP/tools/archive.tgz" -C "$RUNNER_TEMP/tools" --strip-components=1 --wildcards "*/$3"
            mv "$RUNNER_TEMP/tools/$3" "$RUNNER_TEMP/tools/bin/$3"
          }
          fetch "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz" \
            33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c rg
          fetch "https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz" \
            761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7 fd
          "$RUNNER_TEMP/tools/bin/rg" --version | head -1
          "$RUNNER_TEMP/tools/bin/fd" --version

      - name: Clone the plugins the tapes need
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          owner=$(jq -r .owner src/data/registry.json)
          # A bare slug is one of the family (<owner>/<slug>.nvim); "owner/repo"
          # names a third-party dependency such as nvim-telescope/telescope.nvim,
          # checked out under its own repository name.
          # A third-party dependency is pinned to a commit (owner/repo@sha): its
          # code runs in the container that writes what the site serves.
          for dep in $(jq -r '[.tapes[] | .plugin, .deps[]] | unique[]' demos/demos.json); do
            case "$dep" in
              */*@*)
                repo="${dep%@*}"; sha="${dep##*@}"; dir="$RUNNER_TEMP/repos/${repo##*/}"
                git init --quiet "$dir"
                git -C "$dir" fetch --quiet --depth 1 "https://github.com/$repo.git" "$sha"
                git -C "$dir" -c advice.detachedHead=false checkout --quiet FETCH_HEAD ;;
              */*) echo "::error::third-party dependency '$dep' must be pinned as owner/repo@sha"; exit 1 ;;
              *)   git clone --quiet --depth 1 "https://github.com/$owner/$dep.nvim.git" "$RUNNER_TEMP/repos/$dep.nvim" ;;
            esac
          done

      - name: Record
        run: |
          docker pull -q "$VHS_IMAGE"
          docker run --rm --entrypoint vhs "$VHS_IMAGE" --version
          mkdir -p demos/out
          # The container sees the repo at /vhs (its WORKDIR), Neovim at
          # /opt/nvim and the checkouts at /opt/repos; the tapes cd to $WKD_ROOT.
          vhs_run() {
            docker run --rm \
              -v "$PWD:/vhs" \
              -v "$RUNNER_TEMP/nvim:/opt/nvim:ro" \
              -v "$RUNNER_TEMP/repos:/opt/repos:ro" \
              -v "$RUNNER_TEMP/tools:/opt/tools:ro" \
              -e PATH="/opt/nvim/bin:/opt/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              -e PLUGINS_DIR=/opt/repos -e WKD_ROOT=/vhs -e TERM=xterm-256color \
              "$VHS_IMAGE" "$@"
          }
          for tape in demos/*.tape; do
            case "$tape" in demos/_*) continue ;; esac
            echo "::group::$tape"
            vhs_run "$tape"
            echo "::endgroup::"
          done
          # The container runs as root: take the outputs back (VHS writes them
          # relative to its working directory, i.e. ./out).
          sudo chown -R "$(id -u):$(id -g)" demos out 2>/dev/null || true
          # Collect the recordings into demos/out/ (VHS writes relative to its cwd,
          # so ./out; older VHS wrote next to the tape).
          find ./out ./demos -type f \( -name "*.webm" -o -name "*.mp4" \) -not -path "./demos/out/*" -print -exec mv -t demos/out/ {} + 2>/dev/null || true
          # Diagnostics written by :DemoDump (demos/init.lua): into the log, not the branch.
          for dump in demos/out/_dump-*.txt; do
            [ -f "$dump" ] || continue
            echo "::group::$dump"; cat "$dump"; echo "::endgroup::"
            rm -f "$dump"
          done
          ls -l demos/out
          test -n "$(ls demos/out/*.webm 2>/dev/null)" || { echo "::error::no recordings produced"; exit 1; }
          # Posters: one frame from each recording, with the container's ffmpeg.
          for webm in demos/out/*.webm; do
            docker run --rm -v "$PWD:/vhs" --entrypoint ffmpeg "$VHS_IMAGE" \
              -y -loglevel error -ss 1.5 -i "/vhs/$webm" -frames:v 1 "/vhs/${webm%.webm}.png"
          done
          sudo chown -R "$(id -u):$(id -g)" demos
          ls -l demos/out

      - name: Publish demo-assets branch
        run: |
          cd demos/out
          # Only recordings and posters leave this job: the deploy copies the
          # branch verbatim under the site's origin, so nothing else may ride
          # along from a container that ran third-party code.
          stray=$(find . -type f -not \( -name "*.webm" -o -name "*.mp4" -o -name "*.png" \) | head -5)
          if [ -n "$stray" ]; then echo "::error::unexpected files in demos/out: $stray"; exit 1; fi
          git init -q
          git checkout -q -b demo-assets
          git add .
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -q -m "demos recorded $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::12}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
