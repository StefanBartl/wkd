name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [plugin-push]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # New demo recordings (see demos.yml) go live without waiting for the cron.
  workflow_run:
    workflows: ["Record demos"]
    types: [completed]

# Least privilege: the build job only reads; the Pages token is minted in
# the deploy job alone. Actions are pinned to commits (the tag is a comment).
permissions:
  contents: read

# Newer runs wait for (not cancel) the running one: cancelling mid
# deploy-pages leaves the environment on a failed deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The content loader reads plugin checkouts from disk. Treeless clones
      # (tree:0) keep full commit history -- for counts and the activity
      # stream -- and fetch only HEAD's tree and blobs on checkout; nothing
      # reads historical trees. Clones run in parallel; a private or missing
      # repo is skipped with a warning (documented in the README), anything
      # else -- 5xx, timeout, RPC failure -- fails the run after one retry so
      # a partial site never replaces a good one.
      - name: Clone plugin repositories
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          clone() {
            local name="$1" err
            for try in 1 2; do
              if err=$(git clone --quiet --filter=tree:0 "https://github.com/$OWNER/$name.git" "$RUNNER_TEMP/repos/$name" 2>&1); then
                return 0
              fi
              if grep -qiE 'not found|authentication failed|could not read username' <<<"$err"; then
                echo "::warning::$name could not be cloned (private or missing) -- skipped"
                return 0
              fi
              rm -rf "$RUNNER_TEMP/repos/$name"
              sleep 5
            done
            echo "::error::$name: clone failed: $err"
            return 1
          }
          export -f clone
          export OWNER="$(jq -r .owner src/data/registry.json)" RUNNER_TEMP
          jq -r '.plugins[].name' src/data/registry.json | xargs -P 6 -I{} bash -c 'clone "$1"' _ {}
          echo "PLUGINS_DIR=$RUNNER_TEMP/repos" >> "$GITHUB_ENV"

      # Demo videos live on the orphan branch demo-assets (written by demos.yml);
      # the loader turns whatever is in public/demos/ into <video> on plugin pages.
      # Only a branch that is really not there means "no demos": a fetch that
      # fails for any other reason must not deploy a demo-less site over a
      # good one. (ls-remote exits 2 when no ref matches, 128 when origin
      # cannot be queried; the shell is bash -e, so a failing fetch or
      # checkout in the then-branch fails the job.)
      - name: Fetch demo recordings
        run: |
          mkdir -p public/demos
          if git ls-remote --exit-code --heads origin demo-assets >/dev/null; then
            git fetch --quiet --depth 1 origin demo-assets
            git --work-tree=public/demos checkout --quiet FETCH_HEAD -- .
            echo "demos: $(ls public/demos | wc -l) files"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "::notice::no demo-assets branch yet -- building without demos"
            else
              echo "::error::could not query origin for demo-assets (git exit $status)"; exit 1
            fi
          fi

      - name: Install, build and upload
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
