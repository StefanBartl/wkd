name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [plugin-push]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Newer runs wait for (not cancel) the running one: cancelling mid
# deploy-pages leaves the environment on a failed deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The content loader reads plugin checkouts from disk. Treeless clones
      # keep full commit history (for counts and the activity stream) while
      # fetching blobs only for the checked-out tree. Clones run in parallel;
      # a private or missing repo is skipped with a warning (documented in
      # the README), anything else -- 5xx, timeout, RPC failure -- fails the
      # run after one retry so a partial site never replaces a good one.
      - name: Clone plugin repositories
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          clone() {
            local name="$1" err
            for try in 1 2; do
              if err=$(git clone --quiet --filter=blob:none "https://github.com/$OWNER/$name.git" "$RUNNER_TEMP/repos/$name" 2>&1); then
                return 0
              fi
              if grep -qiE 'not found|authentication failed|could not read username' <<<"$err"; then
                echo "::warning::$name could not be cloned (private or missing) -- skipped"
                return 0
              fi
              rm -rf "$RUNNER_TEMP/repos/$name"
              sleep 5
            done
            echo "::error::$name: clone failed: $err"
            return 1
          }
          export -f clone
          export OWNER="$(jq -r .owner src/data/registry.json)" RUNNER_TEMP
          jq -r '.plugins[].name' src/data/registry.json | xargs -P 6 -I{} bash -c 'clone "$1"' _ {}
          echo "PLUGINS_DIR=$RUNNER_TEMP/repos" >> "$GITHUB_ENV"

      - name: Install, build and upload
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
